name: publish
# 승인된 릴스를 예약 시각에 인스타그램에 게시 (publish/queue/*.json)
on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths: ["publish/queue/**"]
  repository_dispatch:
    types: [publish_tick]
  workflow_dispatch:
    inputs:
      check:
        description: "연결 확인만 (1)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            publish
      - run: python scripts/ig_publish.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841454752501358"
          IG_CHECK: ${{ github.event.inputs.check }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name publish-bot
          git config user.email bot@users.noreply.github.com
          git add -A publish/queue 2>/dev/null || true
          git diff --cached --quiet || git commit -m "publish: 게시 결과 기록"
          git pull --rebase --autostash origin main && git push
