name: telegram
# Claude 가 telegram/outbox/<id>/ 를 push 하면 텔레그램으로 개별 이미지·영상·캡션을 보내고 sent.json 을 커밋한다.
on:
  push:
    paths: ["telegram/outbox/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: telegram
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python scripts/telegram_send.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - if: always()
        run: |
          git config user.name telegram-bot
          git config user.email bot@users.noreply.github.com
          git add telegram/outbox
          git diff --cached --quiet || git commit -m "telegram: sent $(date +%F-%H%M)"
          git pull --rebase --autostash origin main
          git push
