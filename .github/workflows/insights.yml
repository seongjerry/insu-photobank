name: insights
# 지난주 게시물 성과 수집 (월요일 리포트용). Claude 예약 작업이 실행하고 결과 파일을 분석한다.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "최근 며칠"
        default: "8"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/insights.py
        env:
          DAYS: ${{ github.event.inputs.days || '8' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841454752501358"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: |
          git config user.name insights-bot
          git config user.email bot@users.noreply.github.com
          git add -A publish/insights
          git diff --cached --quiet || git commit -m "insights: $(date +%F)"
          git pull --rebase --autostash origin main && git push
