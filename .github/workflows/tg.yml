name: tg
# 텔레그램 보고 전송(send) / 승인 답장 읽기(poll). Claude가 publish/outbox 에 메시지를 넣고 push 하면 자동 전송
on:
  push:
    paths: ["publish/outbox/**"]
  workflow_dispatch:
    inputs:
      mode:
        description: "send 또는 poll"
        default: "send"
permissions:
  contents: write
concurrency:
  group: tg
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/tg.py
        env:
          MODE: ${{ github.event.inputs.mode || 'send' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name tg-bot
          git config user.email bot@users.noreply.github.com
          git add -A publish/outbox publish/inbox
          git diff --cached --quiet || git commit -m "tg: $(date +%F-%H%M)"
          git pull --rebase --autostash origin main && git push
