<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/pretendard/dist/web/static/pretendard.css">
<link rel="stylesheet" href="node_modules/@fontsource/nanum-pen-script/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#FBFAF6}
body{font-family:Pretendard,sans-serif;letter-spacing:-0.02em;color:#222;position:relative}
#paper{position:absolute;inset:0;background-image:linear-gradient(#E7ECF3 2px,transparent 2px),linear-gradient(90deg,#E7ECF3 2px,transparent 2px);background-size:60px 60px}
.scene{position:absolute;left:0;right:0;top:85px;bottom:-85px;display:none;transform-origin:50% 40%}
.abs{position:absolute}
.pen{font-family:'Nanum Pen Script',cursive;letter-spacing:0;color:#1F4FD8}
.red{font-family:'Nanum Pen Script',cursive;letter-spacing:0;color:#E23B3B}
.ttl{font-weight:900;letter-spacing:-0.05em;line-height:1.18}
.mk,.mkp,.mkb{background-repeat:no-repeat;background-position:0 0;background-size:0% 100%;padding:0 6px}
.mk{background-image:linear-gradient(transparent 55%,#FFE45C 55%,#FFE45C 92%,transparent 92%)}
.mkp{background-image:linear-gradient(transparent 55%,#FFB3C7 55%,#FFB3C7 92%,transparent 92%)}
.mkb{background-image:linear-gradient(transparent 55%,#BFD7FF 55%,#BFD7FF 92%,transparent 92%)}
.note{position:absolute;background:#FFF27A;box-shadow:0 12px 26px rgba(0,0,0,.13);padding:36px 42px}
.note:before{content:"";position:absolute;top:-22px;left:50%;width:150px;height:44px;margin-left:-75px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}
.cap{position:absolute;left:70px;right:70px;top:1360px;text-align:center;font-size:52px;font-weight:800;line-height:1.38;color:#1A1A1A;letter-spacing:-0.04em}
svg.d{position:absolute;overflow:visible}
svg.d path,svg.d rect{vector-effect:non-scaling-stroke}
.lbl{font-family:'Nanum Pen Script';fill:#222}
</style></head><body>
<div id="paper"></div>
